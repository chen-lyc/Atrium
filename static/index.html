<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!--
    1. 【布局改动】
    - 主区域消息 viewport / header / composer 全部限制到 800px，并在主区域内居中
    - 消息从靠底堆叠改为更接近 Slack 的顶部阅读流
    - 连续消息正文增加统一正文缩进，组间距调到 20px，组内间距调到 6px

    2. 【颜色改动】
    - 删除用户名染色和相关 hash 色板
    - 所有用户名统一使用深灰色 `#37352F`（暗色模式下切换为高可读浅色）
    - 仅保留 `• 你` 作为强调色标记

    3. 【新增仪式动画】
    - 页面首次加载：侧边栏 / header / 消息区 / 输入区依次显现
    - 连接建立瞬间：状态点放大变绿，并有一次性的淡绿色光环扩散
    - 第一次发送消息：更夸张的 spring 弹道 + 落位后一次蓝色高亮淡出
    - 昵称确认瞬间：Modal 收束退出，侧边栏昵称随后“降落”进空间

    4. 【删除的日常动画】
    - 删除发送按钮的激活弹跳
    - 删除 connecting / reconnecting 状态点呼吸动画
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Minimal WebSocket chat UI for a custom C++ backend." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-page: #fbfbfa;
            --bg-sidebar: #f7f7f5;
            --bg-main: #fbfbfa;
            --bg-hover: #f3f3f2;
            --bg-active: #efefee;
            --bg-room-hover: #f1f1ef;
            --bg-room-active: #efefee;
            --bg-modal: rgba(15, 15, 15, 0.18);
            --launch-fill: rgba(47, 52, 55, 0.08);
            --line: #ebebea;
            --text: #2f3437;
            --text-name: #37352f;
            --text-muted: #787774;
            --text-subtle: #9b9a97;
            --button: #2f3437;
            --button-text: #ffffff;
            --accent: #2f80ed;
            --success: #238a52;
            --warning: #b67a00;
            --danger: #d44c47;
            --radius: 8px;
            --title: 16px;
            --body: 15px;
            --meta: 12px;
            --content-max: 800px;
            --easing: cubic-bezier(0.22, 1, 0.36, 1);
            --shadow-modal: 0 18px 50px rgba(15, 15, 15, 0.12);
            --focus-ring: 0 0 0 2px rgba(47, 52, 55, 0.14);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-page: #191919;
                --bg-sidebar: #20201f;
                --bg-main: #191919;
                --bg-hover: #242423;
                --bg-active: #2a2a29;
                --bg-room-hover: #2a2a28;
                --bg-room-active: #30302d;
                --bg-modal: rgba(0, 0, 0, 0.36);
                --launch-fill: rgba(236, 236, 233, 0.08);
                --line: #2e2e2c;
                --text: #ecece9;
                --text-name: #ecece9;
                --text-muted: #a0a09c;
                --text-subtle: #6f6f6b;
                --button: #ecece9;
                --button-text: #171717;
                --accent: #58a6ff;
                --success: #4ea669;
                --warning: #d4a11d;
                --danger: #ef6b67;
                --shadow-modal: 0 18px 50px rgba(0, 0, 0, 0.42);
                --focus-ring: 0 0 0 2px rgba(236, 236, 233, 0.14);
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        #root {
            min-height: 100%;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--bg-page);
            color: var(--text);
            font-family: Manrope, "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
            font-size: var(--body);
            line-height: 1.6;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: "ss01" 1, "cv01" 1;
        }

        ::selection {
            background: rgba(120, 119, 116, 0.16);
            color: var(--text);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(120, 119, 116, 0.28);
            border: 2px solid transparent;
            border-radius: 999px;
            background-clip: padding-box;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            border: none;
            background: none;
            color: inherit;
        }

        .focus-ring:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
        }

        .shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr);
            gap: 0;
            background: var(--bg-page);
        }

        .sidebar {
            background: var(--bg-sidebar);
            padding: 18px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-height: 100vh;
        }

        .brand {
            font-size: var(--title);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        .identity {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .identity-name {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 2px 6px;
            margin-left: -6px;
            border-radius: 6px;
            font-size: var(--body);
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .link-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 24px;
            padding: 0 6px;
            border-radius: var(--radius);
            font-size: var(--meta);
            color: var(--text-muted);
            transition: background-color 150ms var(--easing), color 150ms var(--easing);
        }

        .link-button:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .link-button:active {
            background: var(--bg-active);
        }

        .sidebar-title {
            margin-bottom: 6px;
            font-size: 11px;
            line-height: 1.4;
            color: var(--text-subtle);
            letter-spacing: 0.01em;
        }

        .sidebar-group {
            font-size: 11px;
            line-height: 1.4;
            color: var(--text-subtle);
            letter-spacing: 0.01em;
            margin-top: 4px;
        }

        .room-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .room-item {
            position: relative;
            display: flex;
            align-items: center;
            min-height: 32px;
            padding: 0 10px 0 12px;
            border-radius: var(--radius);
            font-size: var(--body);
            color: var(--text);
            transition: background-color 150ms var(--easing), color 150ms var(--easing);
        }

        .room-item:hover {
            background: var(--bg-room-hover);
        }

        .room-item.is-active {
            background: var(--bg-room-active);
        }

        .room-item.is-active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 6px;
            bottom: 6px;
            width: 3px;
            border-radius: 999px;
            background: var(--text);
        }

        .room-note {
            margin-top: 6px;
            padding: 0 12px;
            font-size: var(--meta);
            color: var(--text-subtle);
        }

        .main {
            background: var(--bg-main);
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            justify-content: center;
            padding: 14px 18px;
            background: color-mix(in srgb, var(--bg-main) 92%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: box-shadow 180ms var(--easing);
        }

        .header.is-scrolled {
            box-shadow: 0 1px 0 var(--line);
        }

        .header-inner {
            width: min(100%, var(--content-max));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .room-name {
            font-size: var(--title);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        .status-inline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: var(--meta);
            color: var(--text-muted);
            white-space: nowrap;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--text-subtle);
            flex: 0 0 auto;
        }

        .messages {
            min-height: 0;
            overflow-y: auto;
            padding: 8px 18px 24px;
            display: flex;
            justify-content: center;
        }

        .messages-inner {
            width: min(100%, var(--content-max));
            min-height: 100%;
            padding-top: 18px;
        }

        .message-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .time-divider {
            margin: 18px 0 10px;
            text-align: center;
            font-size: var(--meta);
            color: var(--text-subtle);
        }

        .message-entry {
            width: 100%;
        }

        .message-entry.is-first {
            margin-top: 0;
        }

        .message-entry.is-fresh {
            margin-top: 20px;
        }

        .message-entry.is-grouped {
            margin-top: 6px;
        }

        .message-block {
            width: 100%;
            padding: 4px 6px;
            border-radius: var(--radius);
            transition: background-color 150ms var(--easing);
        }

        .message-block:hover {
            background: var(--bg-hover);
        }

        .message-meta {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 6px;
            line-height: 1.35;
        }

        .message-author {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-name);
        }

        .message-author-button {
            display: inline-flex;
            align-items: center;
            margin-left: -6px;
            padding: 1px 6px;
            border-radius: 6px;
            transition: background-color 150ms var(--easing);
        }

        .message-author-button:hover {
            background: var(--bg-hover);
        }

        .message-you {
            font-size: 11px;
            color: var(--accent);
            font-weight: 500;
        }

        .message-time {
            font-size: var(--meta);
            color: var(--text-subtle);
        }

        .message-text-shell {
            display: block;
            padding-left: 16px;
            border-radius: 6px;
            transform-origin: left top;
            will-change: transform, opacity;
        }

        .message-text {
            margin: 2px 0 0;
            font-size: var(--body);
            line-height: 1.6;
            letter-spacing: -0.01em;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-entry.is-grouped .message-text {
            margin-top: 0;
        }

        .message-state {
            margin-top: 2px;
            font-size: 11px;
            color: var(--text-subtle);
            padding-left: 16px;
        }

        .message-state.is-failed {
            color: var(--danger);
        }

        .empty-state {
            min-height: 100%;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            text-align: center;
        }

        .empty-title {
            font-size: var(--body);
            font-weight: 600;
            color: var(--text);
        }

        .empty-hint {
            margin-top: 4px;
            font-size: var(--meta);
            color: var(--text-subtle);
        }

        .composer {
            position: relative;
            border-top: 1px solid var(--line);
            padding: 12px 18px 18px;
            background: var(--bg-main);
            display: flex;
            justify-content: center;
        }

        .composer-inner {
            width: min(100%, var(--content-max));
            position: relative;
        }

        .composer-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: end;
        }

        .composer-field {
            position: relative;
            min-height: 44px;
            padding-left: 16px;
        }

        .composer-input {
            min-height: 44px;
            max-height: 160px;
            width: 100%;
            resize: none;
            border: 0;
            background: transparent;
            padding: 6px 0 0;
            color: var(--text);
            outline: none;
            font-size: var(--body);
            line-height: 1.6;
        }

        .message-flight {
            position: fixed;
            z-index: 60;
            pointer-events: none;
            padding-left: 16px;
            transform-origin: left top;
            will-change: transform, width, opacity;
        }

        .message-flight .message-text {
            margin: 0;
        }

        .composer-input::placeholder,
        .field-input::placeholder {
            color: var(--text-subtle);
        }

        .icon-button,
        .modal-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            transition: background-color 150ms var(--easing), color 150ms var(--easing);
        }

        .icon-button {
            width: 32px;
            height: 32px;
            color: var(--text-muted);
        }

        .icon-button:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .icon-button:active {
            background: var(--bg-active);
        }

        .send-button {
            width: 32px;
            height: 32px;
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-subtle);
            transition: background-color 300ms var(--easing), color 300ms var(--easing), transform 180ms var(--easing);
        }

        .send-button.is-active {
            background: var(--button);
            color: var(--button-text);
        }

        .send-button:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .send-button.is-active:hover {
            background: color-mix(in srgb, var(--button) 92%, black);
            color: var(--button-text);
        }

        .send-button:active {
            background: var(--bg-active);
        }

        .send-button.is-active:active {
            background: color-mix(in srgb, var(--button) 84%, black);
        }

        .status-signal {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 8px;
            height: 8px;
        }

        .status-ring {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            border: 1.5px solid color-mix(in srgb, var(--success) 72%, transparent);
            pointer-events: none;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal {
            width: min(100%, 360px);
            border-radius: var(--radius);
            background: var(--bg-main);
            box-shadow: var(--shadow-modal);
            padding: 16px;
        }

        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .modal-title {
            margin: 0;
            font-size: var(--title);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.3;
            color: var(--text);
        }

        .modal-desc {
            margin-top: 4px;
            font-size: var(--meta);
            color: var(--text-muted);
            line-height: 1.5;
        }

        .field-input {
            width: 100%;
            margin-top: 14px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: transparent;
            padding: 10px 12px;
            color: var(--text);
            outline: none;
            transition: background-color 150ms var(--easing), border-color 150ms var(--easing);
        }

        .field-input:hover {
            background: var(--bg-hover);
        }

        .field-input:focus {
            border-color: var(--text-subtle);
            box-shadow: var(--focus-ring);
        }

        .modal-actions {
            margin-top: 14px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .modal-button {
            min-height: 32px;
            padding: 0 10px;
            font-size: var(--meta);
        }

        .modal-button.secondary {
            background: transparent;
            color: var(--text-muted);
        }

        .modal-button.secondary:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .modal-button.secondary:active {
            background: var(--bg-active);
        }

        .modal-button.primary {
            background: var(--button);
            color: var(--button-text);
        }

        .modal-button.primary:hover {
            background: color-mix(in srgb, var(--button) 92%, black);
        }

        .modal-button.primary:active {
            background: color-mix(in srgb, var(--button) 84%, black);
        }

        @media (max-width: 900px) {
            .shell {
                grid-template-columns: minmax(0, 1fr);
            }

            .sidebar {
                min-height: auto;
                padding-bottom: 8px;
            }

            .main {
                min-height: 70vh;
            }
        }

        @media (max-width: 640px) {
            .sidebar,
            .header,
            .messages,
            .composer {
                padding-left: 14px;
                padding-right: 14px;
            }

            .header {
                justify-content: stretch;
            }

            .header-inner {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/framer-motion/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useEffect, useRef, useState } = React;

        const motionRuntime = window.Motion || {};
        const fallbackMotion = (tag) => React.forwardRef((props, ref) => {
            const {
                initial,
                animate,
                exit,
                transition,
                layout,
                layoutId,
                whileTap,
                whileHover,
                children,
                ...rest
            } = props;
            return React.createElement(tag, { ...rest, ref }, children);
        });

        const motion = motionRuntime.motion || {
            div: fallbackMotion("div"),
            aside: fallbackMotion("aside"),
            button: fallbackMotion("button"),
            article: fallbackMotion("article"),
            header: fallbackMotion("header"),
            li: fallbackMotion("li"),
            main: fallbackMotion("main"),
            section: fallbackMotion("section"),
            span: fallbackMotion("span")
        };
        const AnimatePresence = motionRuntime.AnimatePresence || ((props) => <>{props.children}</>);
        const LayoutGroup = motionRuntime.LayoutGroup || ((props) => <>{props.children}</>);

        const STORAGE_KEY = "cpp-websocket-chat:nickname";
        const FIRST_SEND_KEY = "cpp-websocket-chat:first-send-done";
        const CHAT_URL = `ws://${window.location.host}/chat`;
        const EASE = [0.22, 1, 0.36, 1];
        const TAP_TRANSITION = { duration: 0.12, ease: EASE };
        const NORMAL_SEND_SPRING = { type: "spring", stiffness: 300, damping: 30, mass: 0.78 };
        const FIRST_SEND_SPRING = { type: "spring", stiffness: 240, damping: 24, mass: 0.88 };
        const LOCAL_SEND_SETTLE_DELAY = 900;

        const STATUS_LABEL = {
            idle: "等待加入",
            connecting: "连接中",
            connected: "已连接",
            reconnecting: "重连中",
            disconnected: "已断开"
        };

        const STATUS_COLOR = {
            idle: "#9B9A97",
            connecting: "#9B9A97",
            connected: "#238A52",
            reconnecting: "#B67A00",
            disconnected: "#D44C47"
        };

        function createId(prefix = "msg") {
            if (window.crypto && typeof window.crypto.randomUUID === "function") {
                return `${prefix}-${window.crypto.randomUUID()}`;
            }
            return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
        }

        function createGuestNickname() {
            return `访客-${Math.floor(1000 + Math.random() * 9000)}`;
        }

        function getStoredNickname() {
            try {
                return localStorage.getItem(STORAGE_KEY) || "";
            } catch (error) {
                return "";
            }
        }

        function getHasSentFirstMessage() {
            try {
                return sessionStorage.getItem(FIRST_SEND_KEY) === "1";
            } catch (error) {
                return false;
            }
        }

        function getTimestampValue(timestamp) {
            const value = new Date(timestamp).getTime();
            return Number.isNaN(value) ? Date.now() : value;
        }

        function formatDividerTime(timestamp, full) {
            return new Intl.DateTimeFormat(
                "zh-CN",
                full
                    ? { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }
                    : { hour: "2-digit", minute: "2-digit" }
            ).format(new Date(getTimestampValue(timestamp)));
        }

        function formatMessageTime(timestamp) {
            return new Intl.DateTimeFormat("zh-CN", {
                hour: "2-digit",
                minute: "2-digit"
            }).format(new Date(getTimestampValue(timestamp)));
        }

        function getIncomingText(payload) {
            if (typeof payload.text === "string") {
                return payload.text;
            }
            if (typeof payload.message === "string") {
                return payload.message;
            }
            if (typeof payload.content === "string") {
                return payload.content;
            }
            return "";
        }

        function normalizeIncomingMessage(payload, currentNickname) {
            const normalizedNickname =
                typeof payload.nickname === "string" && payload.nickname.trim()
                    ? payload.nickname.trim()
                    : "匿名用户";

            return {
                id: payload.id || createId("remote"),
                clientMessageId:
                    typeof payload.clientMessageId === "string"
                        ? payload.clientMessageId
                        : typeof payload.client_message_id === "string"
                            ? payload.client_message_id
                            : "",
                nickname: normalizedNickname,
                text: getIncomingText(payload),
                timestamp: payload.timestamp || new Date().toISOString(),
                isSelf: Boolean(currentNickname && normalizedNickname === currentNickname),
                status: payload.status || "sent",
                source: "server"
            };
        }

        function findPendingLocalMatch(prevMessages, incomingMessage) {
            const exactIdMatch = [...prevMessages]
                .map((message, index) => ({ message, index }))
                .reverse()
                .find(({ message }) => {
                    if (!message.isSelf || message.source !== "local") {
                        return false;
                    }

                    if (!message.clientMessageId || !incomingMessage.clientMessageId) {
                        return false;
                    }

                    return message.clientMessageId === incomingMessage.clientMessageId;
                })?.index;

            if (exactIdMatch != null) {
                return exactIdMatch;
            }

            return [...prevMessages]
                .map((message, index) => ({ message, index }))
                .reverse()
                .find(({ message }) => {
                    if (!message.isSelf || message.source !== "local") {
                        return false;
                    }

                    if (message.nickname !== incomingMessage.nickname || message.text !== incomingMessage.text) {
                        return false;
                    }

                    const timeGap = Math.abs(
                        getTimestampValue(incomingMessage.timestamp) - getTimestampValue(message.timestamp)
                    );

                    return timeGap <= 30000;
                })?.index;
        }

        function mergeIncomingMessage(prevMessages, incomingMessage) {
            if (!incomingMessage.isSelf) {
                return [...prevMessages, incomingMessage];
            }

            const matchIndex = findPendingLocalMatch(prevMessages, incomingMessage);

            if (matchIndex == null) {
                return [...prevMessages, incomingMessage];
            }

            return prevMessages.map((message, index) => {
                if (index !== matchIndex) {
                    return message;
                }

                return {
                    ...message,
                    ...incomingMessage,
                    id: message.id,
                    serverId: incomingMessage.id,
                    clientMessageId: incomingMessage.clientMessageId || message.clientMessageId || "",
                    status: incomingMessage.status === "failed" ? "failed" : "sent",
                    source: "server"
                };
            });
        }

        function decorateMessages(messages) {
            return messages.map((message, index) => {
                const prev = index > 0 ? messages[index - 1] : null;
                const currentTime = getTimestampValue(message.timestamp);
                const previousTime = prev ? getTimestampValue(prev.timestamp) : null;
                const diffMinutes = previousTime == null ? Infinity : Math.abs(currentTime - previousTime) / 60000;
                const groupedWithPrev = Boolean(prev && prev.nickname === message.nickname && diffMinutes <= 2);
                const showAuthor = !groupedWithPrev;
                const showDivider = index === 0 || diffMinutes > 5;

                return {
                    ...message,
                    groupedWithPrev,
                    showAuthor,
                    showDivider,
                    timeLabel: formatMessageTime(message.timestamp),
                    dividerLabel: formatDividerTime(message.timestamp, index === 0)
                };
            });
        }

        function useWebSocket({ url, nickname, enabled }) {
            const socketRef = useRef(null);
            const reconnectTimerRef = useRef(null);
            const reconnectAttemptRef = useRef(0);
            const pendingResolveTimersRef = useRef(new Map());

            const [messages, setMessages] = useState([]);
            const [connectionState, setConnectionState] = useState(enabled ? "connecting" : "idle");
            const [reconnectAttempt, setReconnectAttempt] = useState(0);
            const [lastError, setLastError] = useState("");

            function clearPendingResolveTimer(messageId) {
                const timerId = pendingResolveTimersRef.current.get(messageId);
                if (timerId == null) {
                    return;
                }

                window.clearTimeout(timerId);
                pendingResolveTimersRef.current.delete(messageId);
            }

            function schedulePendingResolve(messageId) {
                clearPendingResolveTimer(messageId);

                const timerId = window.setTimeout(() => {
                    pendingResolveTimersRef.current.delete(messageId);
                    setMessages((prev) =>
                        prev.map((message) =>
                            message.id === messageId && message.status === "pending"
                                ? { ...message, status: "sent" }
                                : message
                        )
                    );
                }, LOCAL_SEND_SETTLE_DELAY);

                pendingResolveTimersRef.current.set(messageId, timerId);
            }

            function markLocalMessageFailed(messageId) {
                clearPendingResolveTimer(messageId);
                setMessages((prev) =>
                    prev.map((message) =>
                        message.id === messageId
                            ? { ...message, status: "failed" }
                            : message
                    )
                );
            }

            useEffect(() => {
                if (!enabled || !nickname) {
                    setConnectionState("idle");
                    return undefined;
                }

                let cancelled = false;

                const cleanupSocket = () => {
                    const current = socketRef.current;
                    socketRef.current = null;
                    if (current && (current.readyState === WebSocket.OPEN || current.readyState === WebSocket.CONNECTING)) {
                        current.close();
                    }
                };

                const scheduleReconnect = () => {
                    if (cancelled) {
                        return;
                    }

                    const nextAttempt = reconnectAttemptRef.current + 1;
                    reconnectAttemptRef.current = nextAttempt;
                    setReconnectAttempt(nextAttempt);
                    setConnectionState("reconnecting");

                    const delay = Math.min(1200 + nextAttempt * 900, 6400);
                    window.clearTimeout(reconnectTimerRef.current);
                    reconnectTimerRef.current = window.setTimeout(() => {
                        openSocket();
                    }, delay);
                };

                const openSocket = () => {
                    if (cancelled) {
                        return;
                    }

                    setConnectionState(reconnectAttemptRef.current > 0 ? "reconnecting" : "connecting");

                    try {
                        const ws = new WebSocket(url);
                        socketRef.current = ws;

                        ws.onopen = () => {
                            if (cancelled) {
                                return;
                            }
                            reconnectAttemptRef.current = 0;
                            setReconnectAttempt(0);
                            setConnectionState("connected");
                            setLastError("");
                        };

                        ws.onmessage = async (event) => {
                            if (cancelled) {
                                return;
                            }

                            try {
                                const rawData =
                                    typeof event.data === "string"
                                        ? event.data
                                        : event.data instanceof Blob
                                            ? await event.data.text()
                                            : String(event.data);

                                if (cancelled) {
                                    return;
                                }

                                const payload = JSON.parse(rawData);
                                const nextMessage = normalizeIncomingMessage(payload, nickname);
                                setMessages((prev) => {
                                    if (nextMessage.isSelf) {
                                        const matchIndex = findPendingLocalMatch(prev, nextMessage);
                                        if (matchIndex != null) {
                                            clearPendingResolveTimer(prev[matchIndex].id);
                                        }
                                    }

                                    return mergeIncomingMessage(prev, nextMessage);
                                });
                            } catch (error) {
                                console.warn("Invalid message payload:", error);
                            }
                        };

                        ws.onerror = () => {
                            if (cancelled) {
                                return;
                            }
                            setLastError("连接过程中发生错误");
                        };

                        ws.onclose = () => {
                            if (cancelled) {
                                return;
                            }
                            socketRef.current = null;
                            setConnectionState("disconnected");
                            scheduleReconnect();
                        };
                    } catch (error) {
                        setLastError("浏览器无法建立 WebSocket 连接");
                        scheduleReconnect();
                    }
                };

                openSocket();

                return () => {
                    cancelled = true;
                    window.clearTimeout(reconnectTimerRef.current);
                    pendingResolveTimersRef.current.forEach((timerId) => {
                        window.clearTimeout(timerId);
                    });
                    pendingResolveTimersRef.current.clear();
                    cleanupSocket();
                };
            }, [url, nickname, enabled]);

            function sendChatMessage(text) {
                const content = text.trim();
                const current = socketRef.current;

                if (!content || !nickname || !current || current.readyState !== WebSocket.OPEN) {
                    return null;
                }

                const localMessage = {
                    id: createId("local"),
                    clientMessageId: createId("client"),
                    nickname,
                    text: content,
                    timestamp: new Date().toISOString(),
                    isSelf: true,
                    status: "pending",
                    source: "local"
                };

                setMessages((prev) => [...prev, localMessage]);

                try {
                    current.send(JSON.stringify({ nickname, text: content }));
                    schedulePendingResolve(localMessage.id);
                    return localMessage;
                } catch (error) {
                    const failedMessage = { ...localMessage, status: "failed" };
                    markLocalMessageFailed(localMessage.id);
                    setLastError("消息发送失败");
                    return failedMessage;
                }
            }

            return {
                messages,
                connectionState,
                reconnectAttempt,
                lastError,
                sendChatMessage
            };
        }

                                        className="modal-button primary focus-ring"
                                        onClick={onConfirm}
                                        whileTap={{ scale: 0.97 }}
                                        transition={TAP_TRANSITION}
                                    >
                                        进入
                                    </motion.button>
                                </div>
                            </motion.div>
                        </motion.div>
                    ) : null}
                </AnimatePresence>
            );
        }

        function App() {
            const launchTimerRef = useRef(null);
            const launchFrameRef = useRef(null);
            const highlightTimerRef = useRef(null);
            const pendingNicknameRef = useRef(null);
            const composerFieldRef = useRef(null);
            const [nickname, setNickname] = useState(() => getStoredNickname());
            const [draftNickname, setDraftNickname] = useState(() => getStoredNickname());
            const [messageDraft, setMessageDraft] = useState("");
            const [isNicknameModalOpen, setNicknameModalOpen] = useState(() => !getStoredNickname());
            const [isHeaderScrolled, setHeaderScrolled] = useState(false);
            const [messageFlight, setMessageFlight] = useState(null);
            const [hiddenMessageId, setHiddenMessageId] = useState(null);
            const [highlightedMessageId, setHighlightedMessageId] = useState(null);
            const [nicknameLandingKey, setNicknameLandingKey] = useState(0);
            const [hasSentFirstMessage, setHasSentFirstMessage] = useState(() => getHasSentFirstMessage());

            const { messages, connectionState, sendChatMessage } = useWebSocket({
                url: CHAT_URL,
                nickname,
                enabled: Boolean(nickname)
            });

            useEffect(() => {
                if (!nickname) {
                    return;
                }

                try {
                    localStorage.setItem(STORAGE_KEY, nickname);
                } catch (error) {
                    console.warn("Unable to persist nickname:", error);
                }
            }, [nickname]);

            useEffect(() => {
                return () => {
                    window.clearTimeout(launchTimerRef.current);
                    if (launchFrameRef.current != null) {
                        window.cancelAnimationFrame(launchFrameRef.current);
                    }
                    window.clearTimeout(highlightTimerRef.current);
                };
            }, []);

            function commitNickname(nextNickname) {
                const trimmed = nextNickname.trim();
                const resolved = trimmed || createGuestNickname();
                setNickname(resolved);
                setDraftNickname(resolved);
                setNicknameLandingKey((value) => value + 1);
            }

            function closeNicknameModalWith(nextNickname) {
                const trimmed = nextNickname.trim();
                const resolved = trimmed || createGuestNickname();
                pendingNicknameRef.current = resolved;
                setDraftNickname(resolved);
                setNicknameModalOpen(false);
            }

            function openRenameModal() {
                pendingNicknameRef.current = null;
                setDraftNickname(nickname || "");
                setNicknameModalOpen(true);
            }

            function handleRandomizeNickname() {
                setDraftNickname(createGuestNickname());
            }

            function handleNicknameModalExited() {
                if (!pendingNicknameRef.current) {
                    return;
                }

                const resolved = pendingNicknameRef.current;
                pendingNicknameRef.current = null;
                commitNickname(resolved);
            }

            function completeMessageFlight(messageId, shouldHighlight) {
                setHiddenMessageId((currentId) => (currentId === messageId ? null : currentId));
                setMessageFlight((currentFlight) => (currentFlight && currentFlight.id === messageId ? null : currentFlight));

                if (shouldHighlight) {
                    setHighlightedMessageId(messageId);
                    window.clearTimeout(highlightTimerRef.current);
                    highlightTimerRef.current = window.setTimeout(() => {
                        setHighlightedMessageId(null);
                    }, 1320);
                }
            }

            function handleSend() {
                const trimmedMessage = messageDraft.trim();
                if (!trimmedMessage) {
                    return;
                }

                const sentMessage = sendChatMessage(trimmedMessage);
                if (sentMessage) {
                    const isFirstSend = !hasSentFirstMessage;
                    const nextSpring = isFirstSend ? FIRST_SEND_SPRING : NORMAL_SEND_SPRING;
                    const composerField = composerFieldRef.current;
                    const composerRect = composerField?.getBoundingClientRect();

                    if (!composerRect) {
                        setMessageDraft("");
                        return;
                    }

                    if (isFirstSend) {
                        setHasSentFirstMessage(true);
                        try {
                            sessionStorage.setItem(FIRST_SEND_KEY, "1");
                        } catch (error) {
                            console.warn("Unable to persist first-send flag:", error);
                        }
                    }

                    setMessageFlight({
                        id: sentMessage.id,
                        text: trimmedMessage,
                        spring: nextSpring,
                        shouldHighlight: isFirstSend,
                        startRect: {
                            left: composerRect.left,
                            top: composerRect.top + 6,
                            width: Math.max(120, composerRect.width - 16)
                        },
                        targetRect: null
                    });
                    setHiddenMessageId(sentMessage.id);
                    setMessageDraft("");
                    if (launchFrameRef.current != null) {
                        window.cancelAnimationFrame(launchFrameRef.current);
                    }
                    launchFrameRef.current = window.requestAnimationFrame(() => {
                        launchFrameRef.current = window.requestAnimationFrame(() => {
                            const targetElement = document.querySelector(
                                `[data-message-id="${sentMessage.id}"] .message-text-shell`
                            );

                            if (!targetElement) {
                                completeMessageFlight(sentMessage.id, isFirstSend);
                                launchFrameRef.current = null;
                                return;
                            }

                            const targetRect = targetElement.getBoundingClientRect();
                            setMessageFlight((currentFlight) =>
                                currentFlight && currentFlight.id === sentMessage.id
                                    ? {
                                        ...currentFlight,
                                        targetRect: {
                                            left: targetRect.left,
                                            top: targetRect.top,
                                            width: targetRect.width
                                        }
                                    }
                                    : currentFlight
                            );
                            launchFrameRef.current = null;
                        });
                    });
                    window.clearTimeout(launchTimerRef.current);
                    launchTimerRef.current = window.setTimeout(() => {
                        completeMessageFlight(sentMessage.id, false);
                    }, 1400);
                }
            }

            return (
                <div className="shell">
                    <LayoutGroup id="chat-layout">
                        <Sidebar
                            nickname={nickname}
                            onRename={openRenameModal}
                            nicknameLandingKey={nicknameLandingKey}
                        />

                        <main className="main">
                            <motion.header
                                className={`header ${isHeaderScrolled ? "is-scrolled" : ""}`}
                                initial={false}
                            >
                                <motion.div
                                    className="header-inner"
                                    initial={{ y: -12, opacity: 0 }}
                                    animate={{ y: 0, opacity: 1 }}
                                    transition={{ delay: 0.1, duration: 0.28, ease: EASE }}
                                >
                                    <div className="room-name">/chat</div>
                                    <ConnectionStatus state={connectionState} />
                                </motion.div>
                            </motion.header>

                            <MessageList
                                messages={messages}
                                onScrolled={setHeaderScrolled}
                                hiddenMessageId={hiddenMessageId}
                                highlightedMessageId={highlightedMessageId}
                                suspendSmoothScroll={Boolean(messageFlight)}
                            />

                            <MessageInput
                                value={messageDraft}
                                onChange={setMessageDraft}
                                onSend={handleSend}
                                disabled={!messageDraft.trim() || connectionState !== "connected"}
                                composerFieldRef={composerFieldRef}
                            />
                        </main>
                    </LayoutGroup>

                    <MessageFlight
                        flight={messageFlight}
                        onComplete={(messageId) => {
                            const shouldHighlight = Boolean(
                                messageFlight &&
                                messageFlight.id === messageId &&
                                messageFlight.shouldHighlight
                            );
                            completeMessageFlight(messageId, shouldHighlight);
                        }}
                    />

                    <NicknameModal
                        open={isNicknameModalOpen}
                        draft={draftNickname}
                        onDraftChange={setDraftNickname}
                        onConfirm={() => closeNicknameModalWith(draftNickname)}
                        onRandomize={handleRandomizeNickname}
                        onRequestClose={() => closeNicknameModalWith(draftNickname || nickname || createGuestNickname())}
                        onExited={handleNicknameModalExited}
                    />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
