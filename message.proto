syntax = "proto3";

message LoginRequest {
    string username = 1;
    string password = 2;
}

message RegisterRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    string msg = 1;
}

message RegisterResponse {
    string msg = 1;
}

message ChatMessage {
    string sender_name = 1;
    string msg = 2;
}

message HeartbeatMessage {
    
}

message ErrorResponse {
    string msg = 1;
}